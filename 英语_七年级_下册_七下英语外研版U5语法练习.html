    function lookupMeaning(word) {
        if (meaningMap[word]) return meaningMap[word];
        var lower = word.toLowerCase();
        if (meaningMap[lower]) return meaningMap[lower];
        var withoutS = lower.replace(/s$/, '');
        if (meaningMap[withoutS]) return meaningMap[withoutS];
        var withoutEd = lower.replace(/ed$/, '');
        if (meaningMap[withoutEd]) return meaningMap[withoutEd];
        var withoutIng = lower.replace(/ing$/, '');
        if (meaningMap[withoutIng]) return meaningMap[withoutIng];
        return null;
    }
    function showWordMeaning(word) {
        var meaning = lookupMeaning(word);
        if (!meaning) meaning = "✨ 可自行补充笔记";
        var toast = document.getElementById("wordToast");
        toast.innerText = word + "  ·  " + meaning;

    function makeWordsClickable(container) {
        if (!container) return;
        var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
                if (node.parentElement && (node.parentElement.classList && node.parentElement.classList.contains('clickable-word')) ||
                    (node.parentElement && node.parentElement.closest && node.parentElement.closest('.option, .disabled-opt, .feedback-area, .result-badge, .answer-compare, .detail-explanation, .blank-input, .submit-btn')))
                    return NodeFilter.FILTER_REJECT;
                return NodeFilter.FILTER_ACCEPT;
            }
        });
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function(textNode) {
            var text = textNode.nodeValue;
            if (!text || !text.trim()) return;
            var regex = /\b([A-Za-z][A-Za-z\-']{1,35})\b/g;
            var last = 0, match;
            var frag = document.createDocumentFragment();
            while ((match = regex.exec(text)) !== null) {
                if (match.index > last) frag.appendChild(document.createTextNode(text.substring(last, match.index)));
                var word = match[1];
                var span = document.createElement('span');
                span.className = 'clickable-word';
                span.innerText = word;
                span.addEventListener('click', (function(w) { return function(e) { e.stopPropagation(); showWordMeaning(w); }; })(word));
                frag.appendChild(span);
                last = match.index + match[0].length;
            }
            if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
            if (frag.childNodes.length) textNode.parentNode.replaceChild(frag, textNode);
        });
    }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

        { id: 4, text: "This story is ______ than that one.", opts: ["A. interesting", "B. more interesting", "C. most interesting", "D. the most interesting"], correct: "B", exp: "than提示比较级。", note: "more interesting" },

    html += '<div class="card"><div class="question-panel"><div class="question-text">📝 一、单项选择 (1-20)</div></div></div>';
    for (var i = 0; i < singleChoice.length; i++) { var q = singleChoice[i];
        html += '<div class="card" data-qid="sc_' + q.id + '" data-correct="' + q.correct + '" data-exp="' + escapeHtml(q.exp) + '" data-note="' + escapeHtml(q.note) + '"><div class="question-panel"><div class="question-text">' + q.id + '. ' + escapeHtml(q.text) + '</div><div class="options-list">';
        for (var j = 0; j < q.opts.length; j++) { var opt = q.opts[j];
            html += '<div class="option" data-val="' + opt[0] + '"><div class="option-letter">' + opt[0] + '</div><div class="option-text">' + escapeHtml(opt) + '</div></div>';
        }
        html += '</div></div><div class="feedback-area" style="display:none;"></div></div>';
    }

    // 单词拼写（使用输入框）
    html += '<div class="card"><div class="question-panel"><div class="question-text">📝 二、单词拼写 (21-30)</div></div></div>';
    for (var i = 0; i < wordFill.length; i++) { var q = wordFill[i];
        html += '<div class="card fill-card" data-qid="wf_' + q.id + '" data-correct="' + q.correct + '" data-exp="' + escapeHtml(q.exp) + '" data-note="' + escapeHtml(q.note) + '"><div class="question-panel"><div class="question-text">' + q.id + '. ' + escapeHtml(q.text) + '</div>';
        html += '<input type="text" class="blank-input" placeholder="请输入答案">';
        html += '<button class="submit-btn">提交答案</button>';
        html += '</div><div class="feedback-area" style="display:none;"></div></div>';
    }

    // 阅读理解文章（带点击查词）
    html += '<div class="card"><div class="question-panel"><div class="question-text">📖 阅读理解 · 云南生态旅游项目</div><div class="reading-passage" id="readingPassage">' + escapeHtml("In Yunnan Province, a new eco-tourism project called 'Green Harmony' allows visitors to live with local villagers and participate in environmental protection. Tourists help plant trees, feed rescued wild animals, and learn traditional crafts like bamboo weaving. The project has two key goals: protecting biodiversity and improving villagers' incomes. One unique feature is its 'zero-waste' policy. All waste is sorted and recycled, with 80% of materials reused. Villagers earn income by selling handmade products. 'We used to cut forests for firewood,' said Mr. Li. 'Now, we earn more money by protecting them.' Since its launch in 2023, the project has reduced deforestation by 30% and increased villagers' average monthly income by 40%.") + '</div></div></div>';
    
    var readingQ = [
        { id: 1, text: "What is the main purpose of the 'Green Harmony' project?", opts: ["A. To attract more tourists to Yunnan.", "B. To protect the environment and support local livelihoods.", "C. To build new hotels for visitors.", "D. To teach villagers how to use technology."], correct: "B", exp: "项目有两个目标：保护生物多样性和提高村民收入。", note: "protecting biodiversity and improving incomes" },
        { id: 2, text: "What do tourists NOT do as part of the project?", opts: ["A. Plant trees.", "B. Feed wild animals.", "C. Cut down forests.", "D. Learn bamboo weaving."], correct: "C", exp: "游客帮助植树、喂养动物、学习竹编，不砍伐森林。", note: "not cut down forests" },
        { id: 3, text: "How does the 'zero-waste' policy help the environment?", opts: ["A. By burning all waste.", "B. By recycling most materials.", "C. By importing waste.", "D. By ignoring waste."], correct: "B", exp: "80%的材料被回收利用。", note: "recycled" },
        { id: 4, text: "What change has the project brought to villagers?", opts: ["A. They earn less money.", "B. They cut more forests.", "C. They protect forests for income.", "D. They move to cities."], correct: "C", exp: "现在通过保护森林获得更多收入。", note: "protecting them" },
        { id: 5, text: "What is the result of the project since 2023?", opts: ["A. Deforestation increased.", "B. Income dropped.", "C. Deforestation decreased by 30% and income increased by 40%.", "D. The project failed."], correct: "C", exp: "森林砍伐减少30%，收入增加40%。", note: "reduced by 30%, increased by 40%" }
    ];
    for (var i = 0; i < readingQ.length; i++) { var q = readingQ[i];
        html += '<div class="card" data-qid="rea_' + q.id + '" data-correct="' + q.correct + '" data-exp="' + escapeHtml(q.exp) + '" data-note="' + escapeHtml(q.note) + '"><div class="question-panel"><div class="question-text">' + q.id + '. ' + escapeHtml(q.text) + '</div><div class="options-list">';
        for (var j = 0; j < q.opts.length; j++) { var opt = q.opts[j];
            html += '<div class="option" data-val="' + opt[0] + '"><div class="option-letter">' + opt[0] + '</div><div class="option-text">' + escapeHtml(opt) + '</div></div>';
        }
        html += '</div></div><div class="feedback-area" style="display:none;"></div></div>';
    }

    // 高频短语
    var phrases = [
        { phrase: "the + 比较级, the + 比较级", meaning: "越……, 越……", example: "The more positive you are, the healthier life you will live." },
        { phrase: "比较级 + and + 比较级", meaning: "越来越……", example: "colder and colder, more and more beautiful" },
        { phrase: "one of the + 最高级 + 名词复数", meaning: "最……之一", example: "one of the most popular AI tools" },
        { phrase: "倍数 + 比较级 + than", meaning: "比……大/多几倍", example: "three times bigger than" },
        { phrase: "much / even / a lot + 比较级", meaning: "……得多", example: "much more difficult, even worse" }
    ];
    html += '<div class="analysis-special"><div class="analysis-title">📚 核心语法高频短语 & 句型</div><div class="phrase-list">';
    for (var i = 0; i < phrases.length; i++) { var p = phrases[i];
        html += '<div class="phrase-item"><div class="phrase-text"><span class="phrase-en">' + escapeHtml(p.phrase) + '</span><span class="phrase-zh">' + escapeHtml(p.meaning) + '</span></div><div class="phrase-example">💬 ' + escapeHtml(p.example) + '</div></div>';
    }
    html += '</div></div>';

    html += '<div class="method-card"><div class="badge-method">🎯 解题策略总结</div><ul style="margin-left:20px;color:#375e4c;"><li><strong>1. 比较级标志词：</strong> than, much, even, a little, a lot, far, still。</li><li><strong>2. 最高级标志词：</strong> in/of短语, one of the, 序数词+最高级。</li><li><strong>3. 固定结构：</strong> the+比较级, the+比较级；比较级+and+比较级。</li><li><strong>4. 不规则变化：</strong> good/well→better→best; bad/ill→worse→worst; many/much→more→most。</li><li><strong>5. 倍数表达：</strong> 倍数+比较级+than。</li></ul></div>';

    root.innerHTML = html;
    
    // 使所有文章内容可点击查词
    document.querySelectorAll(".reading-passage, .grammar-passage, .question-text, .option-text, .phrase-item").forEach(function(el) { makeWordsClickable(el); });
    
    // 绑定单选题事件
    document.querySelectorAll('.card[data-qid^="sc_"], .card[data-qid^="rea_"]').forEach(function(card) {
        var correct = card.getAttribute('data-correct');
        var exp = card.getAttribute('data-exp') || "根据上下文分析得出。";
        var note = card.getAttribute('data-note') || "注意固定搭配与逻辑。";
        var optsDiv = card.querySelector('.options-list');
        if (!optsDiv) return;
        var opts = optsDiv.querySelectorAll('.option');
        opts.forEach(function(opt) {
            opt.addEventListener('click', function() {
                if (card.classList.contains('answered')) return;
                var selected = opt.getAttribute('data-val');
                var isCorrect = (selected === correct);
                var fb = card.querySelector('.feedback-area');
                if (!fb) return;
                var yourFull = selected, correctFull = correct;
                opts.forEach(function(o) { if(o.getAttribute('data-val') === selected) yourFull = o.querySelector('.option-text')?.innerText || selected; if(o.getAttribute('data-val') === correct) correctFull = o.querySelector('.option-text')?.innerText || correct; });
                fb.innerHTML = '<div class="result-badge ' + (isCorrect ? 'correct-badge' : 'wrong-badge') + '">' + (isCorrect ? '✔ 回答正确' : '❌ 回答错误') + '</div><div class="answer-compare"><div class="your-answer">📌 你的答案：' + selected + '. ' + escapeHtml(yourFull) + '</div><div class="correct-answer">✅ 正确答案：' + correct + '. ' + escapeHtml(correctFull) + '</div></div><div class="detail-explanation"><strong>🔎 详细解析：</strong> ' + escapeHtml(exp) + '<br/><strong>📘 考点笔记：</strong> ' + escapeHtml(note) + '</div><div class="lock-message">🔒 答案已锁定</div>';
                fb.style.display = 'block';
                card.classList.add('answered');
                opts.forEach(function(o) { o.classList.add('disabled-opt'); });
            });
        });
    });
    
    // 绑定填空题（单词拼写）事件
    document.querySelectorAll('.fill-card').forEach(function(card) {
        var correct = card.getAttribute('data-correct');
        var exp = card.getAttribute('data-exp') || "根据语法规则得出。";
        var note = card.getAttribute('data-note') || "注意词形变化。";
        var input = card.querySelector('.blank-input');
        var btn = card.querySelector('.submit-btn');
        var fb = card.querySelector('.feedback-area');
        btn.addEventListener('click', function() {
            if (card.classList.contains('answered')) return;
            var userAnswer = input.value.trim().toLowerCase();
            var isCorrect = (userAnswer === correct.toLowerCase());
            fb.innerHTML = '<div class="result-badge ' + (isCorrect ? 'correct-badge' : 'wrong-badge') + '">' + (isCorrect ? '✔ 回答正确' : '❌ 回答错误') + '</div><div class="answer-compare"><div class="your-answer">📌 你的答案：' + escapeHtml(userAnswer) + '</div><div class="correct-answer">✅ 正确答案：' + escapeHtml(correct) + '</div></div><div class="detail-explanation"><strong>🔎 详细解析：</strong> ' + escapeHtml(exp) + '<br/><strong>📘 考点笔记：</strong> ' + escapeHtml(note) + '</div><div class="lock-message">🔒 答案已锁定</div>';
            fb.style.display = 'block';
            card.classList.add('answered');
            input.disabled = true;
            btn.disabled = true;
            input.style.opacity = '0.6';
            btn.style.opacity = '0.6';
        });
    });
</script>
</body>
</html>
