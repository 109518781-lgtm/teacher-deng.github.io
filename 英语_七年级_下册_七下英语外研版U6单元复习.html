<script>

    const meaningMap = {

    function lookupMeaning(word) {
        if (meaningMap[word]) return meaningMap[word];
        var lower = word.toLowerCase();
        if (meaningMap[lower]) return meaningMap[lower];
        var withoutS = lower.replace(/s$/, '');
        if (meaningMap[withoutS]) return meaningMap[withoutS];
        var withoutEd = lower.replace(/ed$/, '');
        if (meaningMap[withoutEd]) return meaningMap[withoutEd];
        var withoutIng = lower.replace(/ing$/, '');
        if (meaningMap[withoutIng]) return meaningMap[withoutIng];
        return null;
    }
    function showWordMeaning(word) {
        var meaning = lookupMeaning(word);
        if (!meaning) meaning = "✨ 可自行补充笔记";
        var toast = document.getElementById("wordToast");
        toast.innerText = word + "  ·  " + meaning;
        toast.classList.add("show");
        setTimeout(function() { toast.classList.remove("show"); }, 1500);
    }
    function makeWordsClickable(container) {
        if (!container) return;
        var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
                if (node.parentElement && (node.parentElement.classList && node.parentElement.classList.contains('clickable-word')) ||
                    (node.parentElement && node.parentElement.closest && node.parentElement.closest('.option, .disabled-opt, .feedback-area, .result-badge, .answer-compare, .detail-explanation')))
                    return NodeFilter.FILTER_REJECT;
                return NodeFilter.FILTER_ACCEPT;
            }
        });
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function(textNode) {
            var text = textNode.nodeValue;
            if (!text || !text.trim()) return;
            var regex = /\b([A-Za-z][A-Za-z\-']{1,35})\b/g;
            var last = 0, match;
            var frag = document.createDocumentFragment();
            while ((match = regex.exec(text)) !== null) {
                if (match.index > last) frag.appendChild(document.createTextNode(text.substring(last, match.index)));
                var word = match[1];
                var span = document.createElement('span');
                span.className = 'clickable-word';
                span.innerText = word;
                span.addEventListener('click', (function(w) { return function(e) { e.stopPropagation(); showWordMeaning(w); }; })(word));
                frag.appendChild(span);
                last = match.index + match[0].length;
            }
            if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
            if (frag.childNodes.length) textNode.parentNode.replaceChild(frag, textNode);
        });
    }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

    // ========== 单选题 ==========
    var singleChoice = [

        { id: 3, text: "I ______ a present yesterday, but I don't want to ______ it.", opts: ["A. received; accept", "B. received; receive", "C. accepted; accept", "D. accepted; receive"], correct: "A", exp: "received收到（客观收到），accept接受（主观愿意）。", note: "receive收到，accept接受" },
        { id: 4, text: "He prefers ______ books to ______ to music.", opts: ["A. reading; listening", "B. read; listen", "C. reading; listen", "D. read; listening"], correct: "A", exp: "prefer doing A to doing B 喜欢做A胜过做B。", note: "prefer doing to doing" },
        { id: 5, text: "He is naughty sometimes, but he is a good boy ______.", opts: ["A. in public", "B. in general", "C. in person", "D. in total"], correct: "B", exp: "总的来说，他是个好孩子。", note: "in general总的来说" },

        { id: 7, text: "I want to ______ this question with you.", opts: ["A. shake", "B. mix", "C. discuss", "D. plan"], correct: "C", exp: "讨论这个问题。", note: "discuss讨论" },
        { id: 8, text: "Dreams are beautiful. However, to ______ them needs lots of time and work.", opts: ["A. achieve", "B. discover", "C. find", "D. stop"], correct: "A", exp: "实现梦想需要时间和努力。", note: "achieve实现" },
        { id: 9, text: "Bruce ______ to play football. He likes playing football more than other sports.", opts: ["A. fights", "B. forgets", "C. tries", "D. prefers"], correct: "D", exp: "更喜欢踢足球。", note: "prefers更喜欢" },
        { id: 10, text: "Everyone ______ us to win the basketball game, but we lost.", opts: ["A. expected", "B. wondered", "C. hoped", "D. burned"], correct: "A", exp: "期待我们赢。", note: "expect期待" }

    var grammarFill = [
        { id: 11, text: "The classroom is as ______ (clean) as that one, but it is ______ (small) than that one.", correct: "clean; smaller", exp: "as + 原级 + as; than用比较级。", note: "clean→cleaner" },

    var clozeExps = {

    // ========== 阅读理解 ==========
    var readingPassage = `Jingdezhen, the "Porcelain Capital of the World", is a beautiful city in Jiangxi, China. It has a long history of 2000 years. Last summer holiday, my parents and I went to Jingdezhen. When I got there, it was sunny and hot. In the morning, we started our trip to Jingdezhen Porcelain Museum by bus. The blue and white porcelain from Jingdezhen became the symbol of China. For lunch, we went to an old restaurant to try some delicious Jiangxi dishes, such as oil fish and special bean noodles. In the afternoon, we walked along the Porcelain Street and Taoxichuan Block. Here, you could see many artists at work making different porcelains. We bought some cups and bowls in different colors. Jingdezhen is a must-visit place for anyone interested in Chinese art and history!`;
    var readingQ = [
        { id: 1, text: "What does the underlined word 'It' in paragraph 1 refer to?", opts: ["A. China.", "B. Jiangxi.", "C. Jingdezhen."], correct: "C", exp: "It指代前一句的Jingdezhen。", note: "指代题" },

    // 选词填空
    html += '<div class="card"><div class="question-panel"><div class="question-text">📝 三、选词填空 (16-24) · 周末旅行</div><div class="cloze-passage">' + escapeHtml("I like travelling very much. Last Saturday, I had a lot of fun with my parents. We got up at 6:00 a.m. Half an hour later, we [16] to Long Bay. My father drove very [17]. But he was careful. I had to [18] the trip was a little long. It took us fifty [19] to get to Long Bay! First, we swam. Then we played volleyball. Volleyball is my favorite sport and I'm [20] in it. We had a big lunch [21] a restaurant. In the afternoon, we enjoyed the sunshine. My father went fishing. He [22] to eat fish. He caught a lot of fish. He thought he had good [23]. [24] you want to take a trip, you can go to Long Bay.") + '</div></div></div>';
    for (var i = 0; i < clozeFill.length; i++) { var q = clozeFill[i];
        html += '<div class="card" data-qid="cf_' + q.id + '" data-correct="' + escapeHtml(q.correct) + '" data-exp="' + escapeHtml(q.exp) + '" data-note="' + escapeHtml(q.note) + '"><div class="question-panel"><div class="question-text">' + q.id + '. ' + escapeHtml(q.text) + '</div><div class="options-list"><div class="option" data-val="' + escapeHtml(q.correct) + '"><div class="option-letter">📝</div><div class="option-text">点击显示答案: ' + escapeHtml(q.correct) + '</div></div></div></div><div class="feedback-area" style="display:none;"></div></div>';
    }

    // 完形填空
    html += '<div class="card"><div class="question-panel"><div class="question-text">📖 四、完形填空 · 伦敦之旅</div><div class="cloze-passage" id="clozePassage">' + escapeHtml(clozePassage) + '</div></div></div>';
    for (var i = 1; i <= 11; i++) {
        html += '<div class="card" data-qid="clz_' + i + '" data-correct="' + clozeAnswers[i] + '" data-exp="' + escapeHtml(clozeExps[i]) + '" data-note="完形填空"><div class="question-panel"><div class="question-text">' + i + '. </div><div class="options-list">';
        var opts = clozeOptions[i];
        for (var j = 0; j < opts.length; j++) { var opt = opts[j];
            html += '<div class="option" data-val="' + opt[0] + '"><div class="option-letter">' + opt[0] + '</div><div class="option-text">' + escapeHtml(opt) + '</div></div>';
        }
        html += '</div></div><div class="feedback-area" style="display:none;"></div></div>';
    }

    // 阅读理解
    html += '<div class="card"><div class="question-panel"><div class="question-text">📖 五、阅读理解 · 景德镇之旅</div><div class="reading-passage" id="readingPassage">' + escapeHtml(readingPassage) + '</div></div></div>';
    for (var i = 0; i < readingQ.length; i++) { var q = readingQ[i];
        html += '<div class="card" data-qid="rd_' + q.id + '" data-correct="' + q.correct + '" data-exp="' + escapeHtml(q.exp) + '" data-note="' + escapeHtml(q.note) + '"><div class="question-panel"><div class="question-text">' + q.id + '. ' + escapeHtml(q.text) + '</div><div class="options-list">';
        for (var j = 0; j < q.opts.length; j++) { var opt = q.opts[j];
            html += '<div class="option" data-val="' + opt[0] + '"><div class="option-letter">' + opt[0] + '</div><div class="option-text">' + escapeHtml(opt) + '</div></div>';
        }
        html += '</div></div><div class="feedback-area" style="display:none;"></div></div>';
    }

    // 解题策略
    html += '<div class="method-card"><div class="badge-method">🎯 解题策略</div><ul style="margin-left:20px;color:#375e4c;"><li><strong>1. 固定搭配：</strong> prefer doing to doing, as...as, 比较级+than。</li><li><strong>2. 词义辨析：</strong> receive/accept, speak/tell/talk/say, hope/expect/want。</li><li><strong>3. 上下文逻辑：</strong> 注意转折词but, however等。</li><li><strong>4. 阅读理解技巧：</strong> 先读题再定位，注意指代和顺序。</li></ul></div>';

    root.innerHTML = html;

    // 使可点击
    document.querySelectorAll(".reading-passage, .cloze-passage, .question-text, .option-text, .phrase-item, .method-card").forEach(function(el) { if (el) makeWordsClickable(el); });
    // 绑定选择题事件
    document.querySelectorAll('.card[data-qid]').forEach(function(card) {
        var correct = card.getAttribute('data-correct');
        var exp = card.getAttribute('data-exp') || "根据上下文分析得出。";
        var note = card.getAttribute('data-note') || "注意固定搭配与逻辑。";
        var optsDiv = card.querySelector('.options-list');
        if (!optsDiv) return;
        var opts = optsDiv.querySelectorAll('.option');
        opts.forEach(function(opt) {
            opt.addEventListener('click', function() {
                if (card.classList.contains('answered')) return;
                var selected = opt.getAttribute('data-val');
                var isCorrect = (selected === correct);
                var fb = card.querySelector('.feedback-area');
                if (!fb) return;
                var yourFull = selected, correctFull = correct;
                opts.forEach(function(o) { if(o.getAttribute('data-val') === selected) yourFull = o.querySelector('.option-text')?.innerText || selected; if(o.getAttribute('data-val') === correct) correctFull = o.querySelector('.option-text')?.innerText || correct; });
                fb.innerHTML = '<div class="result-badge ' + (isCorrect ? 'correct-badge' : 'wrong-badge') + '">' + (isCorrect ? '✔ 回答正确' : '❌ 回答错误') + '</div><div class="answer-compare"><div class="your-answer">📌 你的答案：' + selected + '. ' + escapeHtml(yourFull) + '</div><div class="correct-answer">✅ 正确答案：' + correct + '. ' + escapeHtml(correctFull) + '</div></div><div class="detail-explanation"><strong>🔎 详细解析：</strong> ' + escapeHtml(exp) + '<br/><strong>📘 考点笔记：</strong> ' + escapeHtml(note) + '</div><div class="lock-message">🔒 答案已锁定</div>';
                fb.style.display = 'block';
                card.classList.add('answered');
                opts.forEach(function(o) { o.classList.add('disabled-opt'); });
            });
        });
    });
</script>
</body>
</html>
